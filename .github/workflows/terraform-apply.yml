name: terraform apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options:
          - dev
          - qa
          - prod
        default: dev
        required: true
      app_image_digest:
        description: "Container digest to deploy, e.g. sha256:... Leave empty to use the environment's recorded digest. Required the first time an environment is brought up, since it has none yet."
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  WIF_PROVIDER: projects/923128095631/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: sa-terraform@petclinic-capstone.iam.gserviceaccount.com

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: prod applies need ALLOW_PROD_APPLY
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ALLOW_PROD_APPLY: ${{ vars.ALLOW_PROD_APPLY }}
        run: |
          if [ "$ENVIRONMENT" != "prod" ]; then
            echo "Environment is '${ENVIRONMENT}'; the prod guard does not apply."
            exit 0
          fi

          if [ "${ALLOW_PROD_APPLY:-}" = "true" ]; then
            echo "::warning::ALLOW_PROD_APPLY is true. Proceeding with a prod apply - this creates real, billable infrastructure."
            exit 0
          fi

          echo "::error::Refusing to apply prod. envs/prod has never been applied - see docs/environments.md. To override, set the ALLOW_PROD_APPLY repository variable to exactly \"true\". It is currently \"${ALLOW_PROD_APPLY:-<unset>}\"."
          exit 1

  plan:
    name: plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: guard
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles(format('envs/{0}/.terraform.lock.hcl', inputs.environment)) }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: authenticate to gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: terraform init
        working-directory: envs/${{ inputs.environment }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lockfile=readonly

      - name: terraform plan
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_VAR_lb_allowed_members: ${{ vars.LB_ALLOWED_MEMBERS }}
          TF_VAR_iap_oauth_client_secret: ${{ secrets.IAP_OAUTH_CLIENT_SECRET }}
          TF_VAR_cloud_monitoring_notification_email: ${{ vars.CLOUD_MONITORING_EMAIL }}
          TF_VAR_app_image_digest: ${{ inputs.app_image_digest }}
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: render plan
        working-directory: envs/${{ inputs.environment }}
        run: terraform show -no-color tfplan | tee plan.txt

      - name: upload rendered plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-${{ inputs.environment }}-${{ github.run_id }}
          path: envs/${{ inputs.environment }}/plan.txt
          retention-days: 5
          if-no-files-found: error

  apply:
    name: apply ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [guard, plan]

    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles(format('envs/{0}/.terraform.lock.hcl', inputs.environment)) }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: authenticate to gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: terraform init
        working-directory: envs/${{ inputs.environment }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lockfile=readonly

      - name: terraform apply
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_VAR_lb_allowed_members: ${{ vars.LB_ALLOWED_MEMBERS }}
          TF_VAR_iap_oauth_client_secret: ${{ secrets.IAP_OAUTH_CLIENT_SECRET }}
          TF_VAR_cloud_monitoring_notification_email: ${{ vars.CLOUD_MONITORING_EMAIL }}
          TF_VAR_app_image_digest: ${{ inputs.app_image_digest }}
        run: terraform apply -no-color -lock-timeout=5m -auto-approve
