name: terraform ci

on:
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"
      - "ansible/**"
      - "packer/**"
      - ".tflint.hcl"
      - "trivy.yaml"
      - ".github/workflows/**"

permissions: {}

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.6"
  TFLINT_VERSION: "v0.64.0"
  ACTIONLINT_VERSION: "1.7.7"
  ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
  TRIVY_VERSION: "0.73.0"
  TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
  ANSIBLE_CORE_VERSION: "2.21.1"
  ANSIBLE_LINT_VERSION: "26.4.0"
  PACKER_VERSION: "1.15.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  WIF_PROVIDER: projects/923128095631/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: sa-terraform@petclinic-capstone.iam.gserviceaccount.com

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

      - name: the environment roots must be identical
        run: |
          FAILED=0

          for f in versions.tf providers.tf variables.tf main.tf outputs.tf; do
            for e in qa prod; do
              if ! diff -q "envs/dev/${f}" "envs/${e}/${f}" >/dev/null; then
                echo "::error file=envs/${e}/${f}::differs from envs/dev/${f} - environments may differ only in backend.tf and env.auto.tfvars"
                diff -u "envs/dev/${f}" "envs/${e}/${f}" || true
                FAILED=1
              fi
            done
          done

          for e in dev qa prod; do
            EXPECTED="backend.tf main.tf outputs.tf providers.tf variables.tf versions.tf"
            if [ "$e" = "dev" ]; then
              EXPECTED="${EXPECTED} moved.tf"
            fi
            EXPECTED="$(echo "$EXPECTED" | tr ' ' '\n' | sort | tr '\n' ' ')"
            ACTUAL="$(cd "envs/${e}" && for x in *.tf; do echo "$x"; done | sort | tr '\n' ' ')"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::envs/${e} has an unexpected set of .tf files."
              echo "  expected: ${EXPECTED}"
              echo "  actual:   ${ACTUAL}"
              FAILED=1
            fi
          done

          exit "$FAILED"

  validate:
    name: validate ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('envs/dev/.terraform.lock.hcl') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: terraform init
        working-directory: envs/${{ matrix.environment }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -backend=false -lockfile=readonly

      - name: terraform validate
        working-directory: envs/${{ matrix.environment }}
        run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint --init
        run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tflint
        run: tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl" --format compact

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  scan:
    name: security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: trivy config scan
        run: |
          curl -sSLo trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar xzf trivy.tar.gz trivy
          ./trivy config .

  packer-validate:
    name: packer validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: packer fmt
        working-directory: packer
        run: packer fmt -check -diff .

      - name: packer init
        working-directory: packer
        run: packer init .

      - name: packer validate
        working-directory: packer
        run: packer validate .

  # Static analysis of the Ansible tree, on a GitHub-hosted runner. It reads
  # files and nothing else - no GCP credentials, no VPC, no inventory.
  #
  # There is deliberately no ansible-playbook job here. Running configuration
  # management from CI means reaching the VMs, which have no public IPs, which
  # means the self-hosted runner on the ops VM. That belongs with the deploy
  # phase, together with the decision about which triggers may target that
  # runner - and while these repos are public, a pull_request trigger never may
  # (see docs/RUNNER.md).
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Cheap, and the one mistake in this tree that would actually leak
      # something: committing the vault file after decrypting it locally.
      - name: refuse a decrypted vault file
        run: |
          DEV_FILE=ansible/inventories/dev/group_vars/all/vault.yml
          if [ ! -f "$DEV_FILE" ]; then
            echo "::error::${DEV_FILE} is missing from the checkout"
            exit 1
          fi

          FAILED=0
          for FILE in ansible/inventories/*/group_vars/all/vault.yml; do
            [ -f "$FILE" ] || continue
            # shellcheck disable=SC2016  # $ANSIBLE_VAULT is a literal file header
            if head -n1 "$FILE" | grep -q '^\$ANSIBLE_VAULT'; then
              echo "encrypted: ${FILE}"
            else
              echo "::error file=${FILE}::not encrypted - re-encrypt with ansible-vault before committing"
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: install ansible-lint
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --quiet --disable-pip-version-check \
            "ansible-core==${ANSIBLE_CORE_VERSION}" \
            "ansible-lint==${ANSIBLE_LINT_VERSION}"

      - name: ansible-lint
        working-directory: ansible
        env:
          ANSIBLE_INVENTORY: /dev/null
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ runner.temp }}/vault-pass
        run: |
          echo 'lint-does-not-decrypt' > "$ANSIBLE_VAULT_PASSWORD_FILE"
          ../.venv/bin/ansible-lint --offline

  # Shared code plans every environment; envs/<env>/ plans only that one.
  changed:
    name: which environments to plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      envs: ${{ steps.pick.outputs.envs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: pick the environments
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          FILES="$(git diff --name-only "${BASE}...${HEAD}")"

          echo "::group::Changed files"
          echo "$FILES"
          echo "::endgroup::"

          if echo "$FILES" | grep -qE '^(envs/_stack/|modules/|\.github/workflows/|\.tflint\.hcl$|trivy\.yaml$)'; then
            ENVS='["dev","qa","prod"]'
            REASON="shared code changed"
          else
            ENVS="$(
              for e in dev qa prod; do
                if echo "$FILES" | grep -q "^envs/${e}/"; then echo "$e"; fi
              done | jq -Rsc 'split("\n") | map(select(length > 0))'
            )"
            REASON="per-environment change"
          fi

          echo "envs=${ENVS}" >> "$GITHUB_OUTPUT"
          echo "::notice::Planning ${ENVS} (${REASON})."

  plan:
    name: plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt, validate, tflint, actionlint, scan, packer-validate, changed]

    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && needs.changed.outputs.envs != '[]'

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.changed.outputs.envs) }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles(format('envs/{0}/.terraform.lock.hcl', matrix.environment)) }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: authenticate to gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # An environment that has never deployed has no digest object to read.
      - name: resolve a digest to plan against
        id: digest
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          BUCKET=petclinic-capstone-tfstate

          if gcloud storage cat "gs://${BUCKET}/deploy/${ENVIRONMENT}/app-image-digest" >/dev/null 2>&1; then
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "${ENVIRONMENT} has a recorded digest; planning against it."
          else
            DIGEST="$(gcloud storage cat "gs://${BUCKET}/deploy/dev/app-image-digest" | tr -d '[:space:]')"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "::notice::${ENVIRONMENT} has never deployed. Planning against dev's digest ${DIGEST} so the template renders."
          fi

      - name: terraform init
        working-directory: envs/${{ matrix.environment }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lockfile=readonly

      - name: terraform plan
        id: plan
        working-directory: envs/${{ matrix.environment }}
        env:
          TF_VAR_lb_allowed_members: ${{ vars.LB_ALLOWED_MEMBERS }}
          TF_VAR_iap_oauth_client_secret: ${{ secrets.IAP_OAUTH_CLIENT_SECRET }}
          TF_VAR_cloud_monitoring_notification_email: ${{ vars.CLOUD_MONITORING_EMAIL }}
          TF_VAR_app_image_digest: ${{ steps.digest.outputs.digest }}
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: render plan
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        working-directory: envs/${{ matrix.environment }}
        run: terraform show -no-color tfplan > plan.txt

      - name: build pr comment
        env:
          CODE: ${{ steps.plan.outputs.exitcode }}
          ENVIRONMENT: ${{ matrix.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: envs/${{ matrix.environment }}
        run: |
          LIMIT=50000

          MOVES_ONLY=no
          if [ "$CODE" = "2" ] && [ -f plan.txt ] \
             && grep -q '^Plan: 0 to add, 0 to change, 0 to destroy\.$' plan.txt \
             && grep -q 'has moved to' plan.txt; then
            MOVES_ONLY=yes
          fi

          case "$CODE" in
            0) HEADER="**No changes.** Infrastructure matches the configuration." ;;
            2) if [ "$MOVES_ONLY" = "yes" ]; then
                 COUNT=$(grep -c 'has moved to' plan.txt)
                 HEADER="**Address moves only.** ${COUNT} resources move to new state addresses; \`0 to add, 0 to change, 0 to destroy\`. Nothing about the infrastructure changes."
               else
                 HEADER="**Changes planned.** Review the diff below before applying."
               fi ;;
            *) HEADER="**Plan failed.** See the job log." ;;
          esac

          {
            echo "<!-- terraform-plan:envs/${ENVIRONMENT} -->"
            echo "### Terraform plan — \`envs/${ENVIRONMENT}\`"
            echo
            echo "$HEADER"
            echo
          } > comment.md

          if [ -f plan.txt ]; then
            SIZE=$(wc -c < plan.txt)
            if [ "$SIZE" -gt "$LIMIT" ]; then
              head -c "$LIMIT" plan.txt > body.txt
              printf '\n... truncated at %s of %s bytes, full plan in the job log ...\n' \
                "$LIMIT" "$SIZE" >> body.txt
            else
              cp plan.txt body.txt
            fi
            {
              echo '<details><summary>Show plan</summary>'
              echo
              echo '```terraform'
              cat body.txt
              echo '```'
              echo
              echo '</details>'
              echo
            } >> comment.md
          fi

          echo "[Full log and plan artifact]($RUN_URL) · commit \`${GITHUB_SHA:0:7}\`" >> comment.md

      - name: upload plan artifact
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-${{ matrix.environment }}
          path: envs/${{ matrix.environment }}/plan.txt
          retention-days: 5
          if-no-files-found: error

      - name: upload pr comment body
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-comment-${{ matrix.environment }}
          path: envs/${{ matrix.environment }}/comment.md
          retention-days: 5
          if-no-files-found: error

      - name: fail if plan errored
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: exit 1

  comment:
    name: comment plan on pr (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changed, plan]
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(needs.changed.outputs.envs) }}

    permissions:
      pull-requests: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: plan-comment-${{ matrix.environment }}

      - name: upsert sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ENVIRONMENT: ${{ matrix.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER="<!-- terraform-plan:envs/${ENVIRONMENT} -->"

          if [ ! -f comment.md ]; then
            {
              echo "$MARKER"
              echo "### Terraform plan — \`envs/${ENVIRONMENT}\`"
              echo
              echo "**Plan job failed before it produced a plan.** See the job log."
              echo
              echo "[Full log]($RUN_URL) · commit \`${GITHUB_SHA:0:7}\`"
            } > comment.md
          fi

          ID=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
                 --jq "map(select(.body | startswith(\"${MARKER}\"))) | .[0].id // empty" \
               | head -n1)

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${ID}" -F body=@comment.md
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@comment.md
          fi
