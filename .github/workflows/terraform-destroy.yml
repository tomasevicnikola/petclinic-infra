name: terraform destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        options:
          - dev
        default: dev
        required: true
      confirm:
        description: Type the environment name to confirm
        type: string
        required: true

permissions: {}

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  WIF_PROVIDER: projects/923128095631/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: sa-terraform@petclinic-capstone.iam.gserviceaccount.com

jobs:
  plan:
    name: plan destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: check confirmation
        env:
          EXPECTED: ${{ inputs.environment }}
          GIVEN: ${{ inputs.confirm }}
        run: |
          if [ "$GIVEN" != "$EXPECTED" ]; then
            echo "confirmation '$GIVEN' does not match environment '$EXPECTED'" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles(format('envs/{0}/.terraform.lock.hcl', inputs.environment)) }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: authenticate to gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: terraform init
        working-directory: envs/${{ inputs.environment }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lockfile=readonly

      - name: terraform plan -destroy
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_VAR_lb_allowed_members: ${{ vars.LB_ALLOWED_MEMBERS }}
          TF_VAR_iap_oauth_client_secret: ${{ secrets.IAP_OAUTH_CLIENT_SECRET }}
        run: terraform plan -destroy -no-color -lock-timeout=5m -out=tfplan

      - name: render destroy plan
        working-directory: envs/${{ inputs.environment }}
        run: terraform show -no-color tfplan | tee plan.txt

      - name: upload rendered destroy plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-destroy-${{ inputs.environment }}-${{ github.run_id }}
          path: envs/${{ inputs.environment }}/plan.txt
          retention-days: 5
          if-no-files-found: error

  destroy:
    name: destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan

    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles(format('envs/{0}/.terraform.lock.hcl', inputs.environment)) }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: authenticate to gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: terraform init
        working-directory: envs/${{ inputs.environment }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lockfile=readonly

      - name: terraform destroy
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_VAR_lb_allowed_members: ${{ vars.LB_ALLOWED_MEMBERS }}
          TF_VAR_iap_oauth_client_secret: ${{ secrets.IAP_OAUTH_CLIENT_SECRET }}
        run: terraform destroy -no-color -lock-timeout=5m -auto-approve
