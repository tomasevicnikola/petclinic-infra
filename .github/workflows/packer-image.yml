name: packer image

# The template tracks the image family, so publishing an image changes what the
# next apply rolls out. Rebakes happen on merge when the image's inputs change,
# and can always be forced by hand.
on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'packer/**'
      - 'ansible/playbooks/image.yml'
      - 'ansible/roles/common/**'
      - 'ansible/roles/docker/**'
      - 'ansible/roles/node_exporter/**'
      - 'ansible/roles/app_runtime/**'
      - '.github/workflows/packer-image.yml'

permissions: {}

concurrency:
  group: packer-image
  cancel-in-progress: false

env:
  PACKER_VERSION: "1.15.4"
  ANSIBLE_CORE_VERSION: "2.21.1"
  WIF_PROVIDER: projects/923128095631/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: sa-packer@petclinic-capstone.iam.gserviceaccount.com

jobs:
  build:
    name: bake the application image
    runs-on: [self-hosted, gcp, ops]
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: isolate the gcloud configuration
        run: echo "CLOUDSDK_CONFIG=${RUNNER_TEMP}/gcloud" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: authenticate to gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: install ansible
        run: |
          # Pinned per run rather than using the ops VM's own ansible. The VM has
          # 2.16 for deploys; an image should not be baked by whatever version
          # happens to be on the build host, or the same commit produces
          # different images on different runners.
          python3 -m venv .venv
          ./.venv/bin/pip install --quiet --disable-pip-version-check \
            "ansible-core==${ANSIBLE_CORE_VERSION}"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"

      - name: packer init
        working-directory: packer
        run: packer init .

      - name: packer fmt
        working-directory: packer
        run: packer fmt -check -diff .

      - name: packer validate
        working-directory: packer
        run: packer validate .

      - name: packer build
        working-directory: packer
        run: packer build -color=false .

      - name: report the image
        working-directory: packer
        run: |
          set -euo pipefail
          IMAGE="$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d: -f2)"
          echo "::notice::Built ${IMAGE} in family petclinic-app"
          {
            echo "## Image \`${IMAGE}\`"
            echo
            echo "Published to family \`petclinic-app\`. Nothing is running it yet."
            echo
            echo "One family serves every environment. Each environment's instance"
            echo "template tracks it, so the next \`terraform apply\` there rolls onto"
            echo "this image. To ship it now:"
            echo
            echo '```sh'
            echo "gh workflow run terraform-apply.yml -R ${GITHUB_REPOSITORY} -f environment=dev   # or qa"
            echo '```'
            echo
            echo "To pin it instead of tracking the family, set \`app_image\` to:"
            echo
            echo '```'
            echo "projects/petclinic-capstone/global/images/${IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
