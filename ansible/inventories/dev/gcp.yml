---
plugin: google.cloud.gcp_compute

projects:
  - petclinic-capstone

zones:
  - europe-west3-a
  - europe-west3-b
  - europe-west3-c

auth_kind: application

filters:
  - status = RUNNING

hostnames:
  - name

vars_prefix: gcp_
strict: true

keyed_groups:
  - key: gcp_tags['items']
    prefix: ""
    separator: ""

compose:
  internal_ip: networkInterfaces[0].networkIP
