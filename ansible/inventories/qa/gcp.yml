---
plugin: google.cloud.gcp_compute

projects:
  - petclinic-capstone

zones:
  - europe-west3-a
  - europe-west3-b
  - europe-west3-c

auth_kind: application

# Scoped by name: the app and ops tags are per-VPC and identical in every
# environment, so a tag-only inventory would return every environment's hosts.
filters:
  - status = RUNNING
  - name = petclinic-qa-*

hostnames:
  - name

vars_prefix: gcp_
strict: true

keyed_groups:
  - key: gcp_tags['items']
    prefix: ""
    separator: ""

compose:
  internal_ip: networkInterfaces[0].networkIP
