---
- name: Require the inventory facts this role depends on
  ansible.builtin.assert:
    that:
      - internal_ip is defined
      - gcp_project is defined
    fail_msg: >-
      internal_ip and gcp_project are supplied by the gcp_compute inventory.
      Running against a static inventory means setting both per host.

- name: Create root's docker configuration directory
  ansible.builtin.file:
    path: /root/.docker
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Configure the Artifact Registry credential helper for root
  ansible.builtin.copy:
    content: "{{ {'credHelpers': {app_deploy_registry: 'gcloud'}} | to_nice_json }}\n"
    dest: /root/.docker/config.json
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Create the application state directory
  ansible.builtin.file:
    path: "{{ app_deploy_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create the placeholder document tree
  ansible.builtin.file:
    path: "{{ app_deploy_placeholder_root }}/actuator"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: app_deploy_placeholder | bool

- name: Write the placeholder health response
  ansible.builtin.copy:
    content: |
      {"status":"UP","placeholder":true}
    dest: "{{ app_deploy_placeholder_root }}/actuator/health"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: app_deploy_placeholder | bool
  notify: Restart the application

- name: Write the placeholder index page
  ansible.builtin.copy:
    content: |
      <!doctype html>
      <title>petclinic placeholder</title>
      <h1>Placeholder</h1>
      <p>Infrastructure is up. The application image has not been deployed yet.</p>
      <p>Served from {{ inventory_hostname }}.</p>
    dest: "{{ app_deploy_placeholder_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: app_deploy_placeholder | bool
  notify: Restart the application

- name: Look for the application unit
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ app_deploy_service_name }}.service
  register: app_deploy_unit
  become: true

- name: Look for a previously deployed container
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{% raw %}{{.Config.Image}}{% endraw %}"
      - "{{ app_deploy_container_name }}"
  register: app_deploy_previous
  changed_when: false
  failed_when: false
  become: true

- name: Record which image the previous container was built from
  ansible.builtin.set_fact:
    app_deploy_previous_image: >-
      {{ app_deploy_previous.stdout | trim
         if app_deploy_previous.rc == 0
         else '' }}

- name: Report the result of the previous-version check
  ansible.builtin.debug:
    msg: >-
      {{ 'Previous version present: ' ~ app_deploy_previous_image ~
         (' (same as the requested image - nothing to remove)'
          if app_deploy_previous_image == app_deploy_image
          else ' (differs from the requested image - removing it)')
         if app_deploy_previous_image
         else 'No previous container on this instance; this is a first deploy.' }}

- name: Pull the image from Artifact Registry
  ansible.builtin.command:
    cmd: docker pull {{ app_deploy_image }}
  register: app_deploy_pull
  changed_when: "'Downloaded newer image' in app_deploy_pull.stdout"
  retries: 3
  delay: 10
  until: app_deploy_pull is succeeded
  become: true

- name: Remove the previous version
  when:
    - app_deploy_previous_image | length > 0
    - app_deploy_previous_image != app_deploy_image
  become: true
  block:
    - name: Stop the application before removing its container
      ansible.builtin.systemd_service:
        name: "{{ app_deploy_service_name }}"
        state: stopped
      when: app_deploy_unit.stat.exists

    - name: Remove the previous container
      ansible.builtin.command:
        cmd: docker rm --force {{ app_deploy_container_name }}
      register: app_deploy_removed
      changed_when: app_deploy_removed.rc == 0
      failed_when:
        - app_deploy_removed.rc != 0
        - "'No such container' not in app_deploy_removed.stderr"

- name: Install the container run script
  ansible.builtin.template:
    src: petclinic-app-run.sh.j2
    dest: "{{ app_deploy_run_script }}"
    owner: root
    group: root
    mode: "0755"
    validate: bash -n %s
  become: true
  notify: Restart the application

- name: Install the application unit
  ansible.builtin.template:
    src: petclinic-app.service.j2
    dest: "/etc/systemd/system/{{ app_deploy_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the application

- name: Apply any pending restart before verifying
  ansible.builtin.meta: flush_handlers

- name: Enable the application
  ansible.builtin.systemd_service:
    name: "{{ app_deploy_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Wait for the application to answer the load balancer's health check
  ansible.builtin.uri:
    url: http://{{ internal_ip }}:{{ app_deploy_port }}/actuator/health
    status_code: 200
  register: app_deploy_health
  retries: "{{ app_deploy_health_retries }}"
  delay: "{{ app_deploy_health_delay }}"
  until: app_deploy_health is succeeded
  changed_when: false

- name: Read the datasource the running container was started with
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ app_deploy_container_name }}"
      - sh
      - -c
      - printf '%s' "$SPRING_DATASOURCE_URL"
  register: app_deploy_running
  changed_when: false
  become: true
  when: not (app_deploy_placeholder | bool)

- name: Confirm the application is on Cloud SQL and not an embedded database
  ansible.builtin.assert:
    that:
      - app_deploy_datasource_url is match('^jdbc:mysql://')
    fail_msg: >-
      The container is serving, but its datasource is
      '{{ app_deploy_datasource_url | default('(unset)') }}' - not the MySQL
      instance. An unset SPRING_DATASOURCE_URL means Spring Boot fell back to
      the embedded H2 database, which answers the health check exactly like a
      real one. Check that dev-db-app-config is readable by sa-app-vm.
    success_msg: "Datasource: {{ app_deploy_datasource_url }}"
  vars:
    app_deploy_datasource_url: "{{ app_deploy_running.stdout | default('') | trim }}"
  when: not (app_deploy_placeholder | bool)
