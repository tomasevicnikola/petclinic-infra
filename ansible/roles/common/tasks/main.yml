---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Read the currently configured timezone
  ansible.builtin.slurp:
    src: /etc/timezone
  register: common_timezone_current
  become: true

- name: Set the system timezone
  ansible.builtin.command:
    cmd: timedatectl set-timezone {{ common_timezone }}
  when: (common_timezone_current.content | b64decode | trim) != common_timezone
  changed_when: true
  become: true

- name: Enable the unattended-upgrades timers
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configure what unattended-upgrades is allowed to install
  ansible.builtin.template:
    src: 52-petclinic-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52-petclinic-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart unattended-upgrades

- name: Enable unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    state: started
    enabled: true
  become: true
