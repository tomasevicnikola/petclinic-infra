---
monitoring_stack_prometheus_ref: "{{ monitoring_stack_prometheus_image }}@{{ monitoring_stack_prometheus_digest }}"
monitoring_stack_grafana_ref: "{{ monitoring_stack_grafana_image }}@{{ monitoring_stack_grafana_digest }}"

monitoring_stack_compose_file: "{{ monitoring_stack_root }}/docker-compose.yml"
monitoring_stack_run_script: /usr/local/bin/petclinic-monitoring-up.sh

# Only the rollout dashboard is provisioned. node-overview.json and jvm-app.json
# stay in files/dashboards/; list one here to provision it.
monitoring_stack_dashboards:
  - rollout.json
