---
node_exporter_version: "1.12.1"
node_exporter_checksum: "sha256:b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
node_exporter_arch: linux-amd64

node_exporter_user: node-exporter
node_exporter_group: node-exporter
node_exporter_install_dir: /opt/node_exporter
node_exporter_bin: /usr/local/bin/node_exporter

node_exporter_listen_address: "{{ ansible_facts['default_ipv4']['address'] }}"
node_exporter_port: 9100

node_exporter_collectors:
  - cpu
  - diskstats
  - filefd
  - filesystem
  - loadavg
  - meminfo
  - netdev
  - os
  - stat
  - time
  - uname
  - vmstat
